[project]
name = "analysis-commit-toggl"
version = "0.1.0"
description = "Fill Toggl Track time entries from git commit history"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
report-to-json = "report_to_json:main"
toggl-fill = "toggl_fill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["report_to_json.py", "toggl_fill.py"]
